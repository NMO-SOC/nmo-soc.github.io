<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found &mdash; NMO-SOC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8E3122">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E8DFC8'/%3E%3Cpath d='M16 5C12 10 5 11 5 16c0 4 4 5 6 3-1 3 1 5 5 8 4-3 6-5 5-8 2 2 6 1 6-3 0-5-7-6-11-11z' fill='%238E3122'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;1,400&family=Marcellus&display=swap" rel="stylesheet">

<style>
  :root{
    --plaster:#E8DFC8;
    --plaster-dim:#CFC2A4;
    --pompeian:#8E3122;
    --pompeian-lit:#A33B29;
    --ink:#241C17;
    --ink-soft:#5C4E42;
    --ochre:#EFCB84;
    --display:"Marcellus",Georgia,serif;
    --text:"Cardo",Georgia,serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{color-scheme:light}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--plaster);
    color:var(--ink);
    font-family:var(--text);
    font-size:19px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .band{
    background:var(--pompeian);
    border-bottom:3px double var(--ochre);
    padding:.9rem 1.25rem;
    text-align:center;
    font-family:var(--display);
    font-size:.66rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ochre);
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:clamp(3rem,10vw,6rem) 1.5rem;
  }

  .numeral{
    font-family:var(--display);
    font-size:clamp(3.5rem,13vw,6.5rem);
    line-height:1;
    letter-spacing:.22em;
    text-indent:.22em;
    margin:0;
    color:var(--pompeian);
  }

  .gloss{
    margin:.9rem 0 0;
    font-family:var(--display);
    font-size:.62rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .hedera{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.1rem;
    margin:2rem auto;
    width:min(15rem,70vw);
  }
  .hedera::before,
  .hedera::after{content:"";flex:1;height:1px;background:var(--plaster-dim)}
  .hedera svg{width:19px;height:19px;fill:var(--pompeian);flex:none}

  .message{
    margin:0 auto 2.5rem;
    max-width:34ch;
    font-size:1.05rem;
  }
  .message em{color:var(--ink-soft)}

  .home{
    display:inline-block;
    padding:1rem 2.25rem;
    background:var(--pompeian);
    color:var(--plaster);
    border:1px solid var(--ochre);
    outline:1px solid var(--pompeian);
    outline-offset:4px;
    text-decoration:none;
    font-family:var(--display);
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    transition:background .35s,outline-color .35s;
  }
  .home:hover,
  .home:focus-visible{background:var(--pompeian-lit);outline-color:var(--ochre)}
  .home:focus-visible{outline-width:2px}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms!important}
  }
</style>
</head>

<body>

<div class="band">NMO &middot; SOC</div>

<main>
  <p class="numeral">CDIV</p>
  <p class="gloss">Pagina non inventa</p>

  <div class="hedera" aria-hidden="true">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 4C12.5 9.5 5 10.5 5 15.5c0 3.9 3.9 5 5.9 3-1 3 .9 5.1 5.1 8.1 4.2-3 6.1-5.1 5.1-8.1 2 2 5.9.9 5.9-3C27 10.5 19.5 9.5 16 4z"/></svg>
  </div>

  <h1 class="message">There is nothing at this address. <em>Check the spelling, or start again from the front page.</em></h1>

  <a class="home" href="/">Ad paginam primam</a>
</main>

</body>
</html>
